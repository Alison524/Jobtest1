let currentQ = 0;
let score = [0,0,0,0];

// 切换页面
function showPage(id) {
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'))
    document.getElementById(id).classList.add('active')
}
function startTest(){
    currentQ=0;
    score=[0,0,0,0];
    renderQ();
    showPage('page-question');
}
function renderQ(){
    const q = questions[currentQ];
    document.getElementById('q-index').innerText = currentQ+1;
    let html = `<h3 class="question-title">${q.title}</h3>`;
    q.options.forEach((opt,i)=>{
        html += `<div class="option-item" onclick="selectOpt(${i})">${opt.txt}</div>`
    })
    document.getElementById('q-wrap').innerHTML = html;
}
function selectOpt(i){
    const opt = questions[currentQ].options[i];
    score[0] += opt.score[0];
    score[1] += opt.score[1];
    score[2] += opt.score[2];
    score[3] += opt.score[3];
    currentQ++;
    if(currentQ >= questions.length){
        calcReport();
        return;
    }
    renderQ();
}
function calcReport(){
    let w=score[0],g=score[1],e=score[2],l=score[3];
    let resIdx;
    if(w<-3 && e<-3) resIdx = 4; //全面内耗
    else if(w<-2 && g<0) resIdx=0; //换工作
    else if(l<-3 && w>=-1) resIdx=1; //换活法
    else if(e>=-2 && g<=-1) resIdx=3; //成长停滞
    else if(e>=-2 && w>=-1 && l>=-1) resIdx=5; //健康
    else resIdx=2; //短期倦怠

    const rep = reports[resIdx];
    document.getElementById('r-title').innerText = rep.tag;
    document.getElementById('r-content').innerHTML = rep.content;
    showPage('page-report');
}
function restartTest(){
    showPage('page-home');
}
